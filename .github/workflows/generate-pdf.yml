name: Generate README PDF

on:
  workflow_dispatch:
    inputs:
      output_file:
        description: Name of the generated PDF file
        required: false
        default: Taha_Abdelaziz_Sr_DevSecOps_Engineer.pdf
        type: string

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      OUTPUT_PDF: ${{ github.event.inputs.output_file || 'Taha_Abdelaziz_Sr_DevSecOps_Engineer.pdf' }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/readme-to-pdf
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt image if available
        run: |
          set +e
          docker pull "$IMAGE_REF"
          pull_status=$?
          set -e
          if [ "$pull_status" -eq 0 ]; then
            echo "Pulled prebuilt image $IMAGE_REF"
          else
            echo "No prebuilt image found for $IMAGE_REF"
          fi

      - name: Build and push image when needed
        run: |
          if ! docker image inspect "$IMAGE_REF" > /dev/null 2>&1; then
            echo "Building image $IMAGE_REF"
            docker build -t "$IMAGE_REF" .
            docker push "$IMAGE_REF"
          else
            echo "Image $IMAGE_REF is available locally; skipping build"
          fi

      - name: Generate PDF
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            -e OUTPUT_PDF="$OUTPUT_PDF" \
            "$IMAGE_REF"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: ${{ github.workspace }}/${{ env.OUTPUT_PDF }}
          if-no-files-found: error
