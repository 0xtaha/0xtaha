name: Generate README PDF

on:
  workflow_dispatch:
    inputs:
      output_file:
        description: Name of the generated PDF file
        required: false
        default: Taha_Abdelaziz_Sr_DevSecOps_Engineer.pdf
        type: string

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      OUTPUT_PDF: ${{ github.event.inputs.output_file || 'Taha_Abdelaziz_Sr_DevSecOps_Engineer.pdf' }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/readme-to-pdf
      IMAGE_TAG: latest
      IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt image from GHCR
        run: |
          docker pull "$IMAGE_REF"

      - name: Verify prebuilt image is available
        run: |
          if ! docker image inspect "$IMAGE_REF" > /dev/null 2>&1; then
            echo "ERROR: Prebuilt image $IMAGE_REF is not available."
            echo "Run the Docker build workflow or push an image with this tag before dispatching this workflow."
            exit 1
          fi

      - name: Generate PDF
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            -e OUTPUT_PDF="$OUTPUT_PDF" \
            "$IMAGE_REF"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: ${{ github.workspace }}/${{ env.OUTPUT_PDF }}
          if-no-files-found: error
